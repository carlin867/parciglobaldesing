
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Cadastro</title>
    <link rel="stylesheet" href="cadastro-login.css">
</head>
<body class="fundologin">
    <form class="formulario" action="logar.php" method="POST">

        <div class="forms">

            <div class="buttonTransition">
                <div class="btngroup">
                    
                    <a class="login_button" href="cadastro.html">Login</a>
            
                </div>
            </div>

            <div class="campo_resposta">

                <div class="login">
                    <label for="iusuariol">
                        
                        <input type="text" name="usuariol" id="iusuariol" placeholder="Usuário">
                    </label>
                    <label for="isenhal">
                      
                        <input type="password" name="senhal" id="isenhal" placeholder="Senha">
                        
                    </label>
                    <img src="eye.svg" alt="" class="mostrarSenha msL">
                    <button class="btn_forms btn_cadastro" name="logar">
                        Logar
                    </button>
                </div>

                
                
            </div>

        </div>

    </form>


    <script>
       var msL = document.querySelector('.msL')
var senhaL = document.querySelector('#isenhal')







msL.addEventListener('click',
    ()=> {
        if(msL.src.includes('eye.svg')) {
            msL.src = 'eye-slash.svg';
            senhaL.setAttribute('type','text')
        } else if(msL.src.includes('eye-slash.svg')) {
            msL.src = 'eye.svg';
            senhaL.setAttribute('type','password')
        }
    }
);
    </script>

  
</body>
</html>
